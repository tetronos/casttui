[project]
name = "casttui"
version = "0.2.0"
description = "A terminal UI for casting media to a Chromecast, built on catt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Depend on catt as a library (import catt.api / catt.controllers), tracking
# upstream, per SCOPE_CastTUI.md §12. catt pulls in pychromecast + yt-dlp.
# urwid is the TUI framework (the paned interface).
dependencies = [
    "catt>=0.13",
    "tomlkit>=0.13",
    "urwid>=2.6",
]

[project.scripts]
casttui = "casttui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casttui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
